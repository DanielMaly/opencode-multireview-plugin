name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify release tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (${TAG_VERSION}) does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci

      - name: Install OpenCode V2 for live tests
        run: |
          VERSION="$(node -p "require('./package.json').devDependencies['@opencode/plugin']")"
          npm install --prefix "$RUNNER_TEMP/opencode-v2" --no-save "@opencode/cli-linux-x64@$VERSION"
          echo "OPENCODE_V2_BIN=$RUNNER_TEMP/opencode-v2/node_modules/@opencode/cli-linux-x64/bin/opencode" >> "$GITHUB_ENV"
          echo "REQUIRE_OPENCODE_V2=1" >> "$GITHUB_ENV"

      - run: npm test

      - name: Publish package
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            IDENTIFIER="${PRERELEASE%%.*}"

            if [[ "$IDENTIFIER" =~ ^[0-9]+$ ]]; then
              NPM_TAG="next"
            else
              NPM_TAG="$IDENTIFIER"
            fi
          else
            NPM_TAG="latest"
          fi

          npm publish --access public --provenance --tag "$NPM_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          generate_release_notes: true
