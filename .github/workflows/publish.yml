name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Verify release tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (${TAG_VERSION}) does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - name: Publish package
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="${VERSION#*-}"
            IDENTIFIER="${PRERELEASE%%.*}"

            if [[ "$IDENTIFIER" =~ ^[0-9]+$ ]]; then
              NPM_TAG="next"
            else
              NPM_TAG="$IDENTIFIER"
            fi
          else
            NPM_TAG="latest"
          fi

          npm publish --access public --provenance --tag "$NPM_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
