name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - run: npm install

      - name: Install OpenCode V2 for live tests
        run: |
          VERSION="$(node -p "require('./package.json').devDependencies['@opencode/plugin']")"
          npm install --prefix "$RUNNER_TEMP/opencode-v2" --no-save "@opencode/cli-linux-x64@$VERSION"
          echo "OPENCODE_V2_BIN=$RUNNER_TEMP/opencode-v2/node_modules/@opencode/cli-linux-x64/bin/opencode" >> "$GITHUB_ENV"
          echo "REQUIRE_OPENCODE_V2=1" >> "$GITHUB_ENV"

      - run: npm test
